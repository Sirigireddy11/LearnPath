
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LearnPath - Login</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      font-family: Arial, sans-serif;
      background: #f0f4ff;
      color: #1e293b;
    }

    .card {
      width: 100%;
      max-width: 400px;
      padding: 30px;
      background: white;
      border-radius: 16px;
      box-shadow: 0 8px 30px #00000012;
    }

    h1 { text-align: center; margin-bottom: 8px; }
    #subtitle, #status { text-align: center; color: #64748b; }
    label { display: block; margin-top: 16px; }
    input {
      width: 100%;
      padding: 12px;
      margin-top: 6px;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
    }
    button {
      width: 100%;
      padding: 12px;
      margin-top: 16px;
      border: 0;
      border-radius: 8px;
      background: #4f46e5;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }
    .secondary {
      background: white;
      color: #4f46e5;
      border: 1px solid #cbd5e1;
    }
    .hidden { display: none; }
  </style>
</head>
<body>
  <main class="card">
    <h1 id="title">Welcome to LearnPath</h1>
    <p id="subtitle">Sign in or create your account</p>

    <form id="form">
      <div id="nameBox" "hidden">
        <label for="name">Your name</label>
        <input id="name" type="text" autocomplete="name">
      </div>

      <label for="email">Email address</label>
      <input id="email" type="email" autocomplete="email" required>

      <label for="password">Password</label>
      <input id="password" type="password"
             autocomplete="current-password" minlength="6" required>

      <div id="confirmBox" "hidden">
        <label for="confirm">Confirm password</label>
        <input id="confirm" type="password" autocomplete="new-password">
      </div>

      <button id="submit" type="submit">Sign In</button>
    </form>

    <button id="toggle" class="secondary" type="button">
      Create a new account
    </button>

    <button id="reset" class="secondary" type="button">
      Forgot password?
    </button>

    <p id="status" role="status" aria-live="polite"></p>
  </main>

  <script type="module" src="auth.js"></script>
</body>
</html>
